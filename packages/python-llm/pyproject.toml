[project]
name = "python-llm"
version = "1.0.0"
description = "LLM provider components for DMS-RAG"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.58.0",
    "anthropic>=0.42.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.11.0",
    "bandit>=1.7.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing --cov-fail-under=75"

[tool.coverage.run]
source = ["python_llm"]

# Clean-Code-Linting: Fehler (E/F), Bugbear (B), Komplexität (C90),
# Pylint-Idiome (PL), Vereinfachung (SIM). Bewusste Ausnahmen für Bestands-
# Entscheidungen (globale FastAPI-Zustände, HTTP-Statuscodes als Literale).
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C90", "PL", "SIM"]
ignore = [
    "BLE001",  # blind exception catch (bewusst in Adaptern)
    "UP006", "UP035", "UP045",  # Stil-Modernisierung (Bestand)
    "PLR2004",  # Magic-Values (HTTP-Statuscodes etc. im Bestand)
    "PLW0603",  # global-Anweisung (FastAPI-App-Zustand)
    "PLC0415",  # Import nach Logger im FastAPI-main
    "E501",  # Zeilenlänge (Bestand hat >100)
    "B905",  # zip ohne strict (bewusst 2.x-kompatibel)
    "SIM102", "SIM105",  # Simplifizierung (Bestand)
    "E722",  # bare except (Stopword-Sammlung etc. im Bestand)
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-args = 8

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true

[tool.bandit]
exclude_dirs = ["tests"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = [
    "python_llm",
]