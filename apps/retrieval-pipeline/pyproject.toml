[project]
name = "dms-rag-retrieval"
version = "1.0.0"
description = "Document retrieval pipeline for DMS-RAG"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "python-dotenv>=1.0.0",
    "python-common @ file:///../../packages/python-common",
    "python-vectordb @ file:///../../packages/python-vectordb",
    "rank-bm25>=0.2.2",
    "nltk>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]
