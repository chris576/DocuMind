[project]
name = "paperless-ai-ingestion"
version = "1.0.0"
description = "Document ingestion pipeline for Paperless-AI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.10.0",
    "httpx>=0.28.0",
    "requests>=2.32.0",
    "aio-pika>=9.5.0",
    "sentence-transformers>=3.3.0",
    "chromadb>=0.5.0",
    "qdrant-client>=1.12.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]
