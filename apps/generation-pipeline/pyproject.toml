[project]
name = "dms-rag-generation"
version = "1.0.0"
description = "Answer generation pipeline for DMS-RAG"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "python-dotenv>=1.0.0",
    "python-common @ file:///../../packages/python-common",
    "python-llm @ file:///../../packages/python-llm",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]
