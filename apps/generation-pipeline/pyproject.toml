[project]
name = "dms-rag-generation"
version = "1.0.0"
description = "Answer generation pipeline for DMS-RAG"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.10.0",
    "httpx>=0.28.0",
    "aio-pika>=9.5.0",
    "openai>=1.58.0",
    "anthropic>=0.42.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]
