version: "3.8"

services:
  # Frontend
  frontend:
    build:
      context: ..
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://backend:3001
    depends_on:
      - backend
    networks:
      - paperless-network

  # Backend (NestJS)
  backend:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - BACKEND_PORT=3001
      - DATABASE_URL=postgresql://paperless:paperless@postgres:5432/paperless_ai
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - PAPERLESS_API_URL=${PAPERLESS_API_URL}
      - PAPERLESS_API_TOKEN=${PAPERLESS_API_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OLLAMA_API_URL=${OLLAMA_API_URL:-http://localhost:11434}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CUSTOM_BASE_URL=${CUSTOM_BASE_URL}
      - CUSTOM_API_KEY=${CUSTOM_API_KEY}
      - OPENCODE_BASE_URL=${OPENCODE_BASE_URL:-http://127.0.0.1:4096}
      - OPENCODE_USERNAME=${OPENCODE_USERNAME:-opencode}
      - OPENCODE_PASSWORD=${OPENCODE_PASSWORD}
      - OPENCODE_MODEL=${OPENCODE_MODEL}
      - VECTOR_DB_TYPE=${VECTOR_DB_TYPE:-chroma}
      - CHROMA_URL=http://chromadb:8000
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - PGVECTOR_URL=postgresql://paperless:paperless@pgvector:5432/paperless_ai
      - INGESTION_PIPELINE_URL=http://ingestion-pipeline:${INGESTION_PORT:-8001}
      - RETRIEVAL_PIPELINE_URL=http://retrieval-pipeline:${RETRIEVAL_PORT:-8002}
      - GENERATION_PIPELINE_URL=http://generation-pipeline:${GENERATION_PORT:-8003}
      - EXTERNAL_API_ENABLED=${EXTERNAL_API_ENABLED:-false}
      - CONFIG_FILE=/data/config.json
      - GATEWAY_API_TOKEN=${GATEWAY_API_TOKEN:-}
    depends_on:
      - postgres
      - chromadb
      - qdrant
      - pgvector
    volumes:
      - ./config:/data
    networks:
      - paperless-network

  # Ingestion Pipeline (Python)
  ingestion-pipeline:
    build:
      context: ..
      dockerfile: apps/ingestion-pipeline/Dockerfile
    ports:
      - "${INGESTION_HOST_PORT:-8001}:${INGESTION_PORT:-8001}"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=${INGESTION_PORT:-8001}
      - GATEWAY_URL=http://backend:3001
      - PAPERLESS_API_URL=${PAPERLESS_API_URL}
      - PAPERLESS_API_TOKEN=${PAPERLESS_API_TOKEN}
      - DOCUMENT_PROVIDER=${DOCUMENT_PROVIDER:-paperless}
      - DOCUMENT_PROVIDER_URL=${DOCUMENT_PROVIDER_URL:-${PAPERLESS_API_URL}}
      - DOCUMENT_PROVIDER_TOKEN=${DOCUMENT_PROVIDER_TOKEN:-${PAPERLESS_API_TOKEN}}
      - VECTOR_DB_TYPE=${VECTOR_DB_TYPE:-chroma}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-sentence_transformer}
      - CHROMA_URL=http://chromadb:8000
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - PGVECTOR_URL=postgresql://paperless:paperless@pgvector:5432/paperless_ai
    depends_on:
      - chromadb
      - qdrant
      - pgvector
    networks:
      - paperless-network

  # Retrieval Pipeline (Python)
  retrieval-pipeline:
    build:
      context: ..
      dockerfile: apps/retrieval-pipeline/Dockerfile
    ports:
      - "${RETRIEVAL_HOST_PORT:-8002}:${RETRIEVAL_PORT:-8002}"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=${RETRIEVAL_PORT:-8002}
      - GATEWAY_URL=http://backend:3001
      - VECTOR_DB_TYPE=${VECTOR_DB_TYPE:-chroma}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-sentence_transformer}
      - RERANKER_PROVIDER=${RERANKER_PROVIDER:-cross_encoder}
      - CHROMA_URL=http://chromadb:8000
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - PGVECTOR_URL=postgresql://paperless:paperless@pgvector:5432/paperless_ai
    depends_on:
      - chromadb
      - qdrant
      - pgvector
    networks:
      - paperless-network

  # Generation Pipeline (Python)
  generation-pipeline:
    build:
      context: ..
      dockerfile: apps/generation-pipeline/Dockerfile
    ports:
      - "${GENERATION_HOST_PORT:-8003}:${GENERATION_PORT:-8003}"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=${GENERATION_PORT:-8003}
      - GATEWAY_URL=http://backend:3001
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OLLAMA_API_URL=${OLLAMA_API_URL:-http://localhost:11434}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CUSTOM_BASE_URL=${CUSTOM_BASE_URL}
      - CUSTOM_API_KEY=${CUSTOM_API_KEY}
      - OPENCODE_BASE_URL=${OPENCODE_BASE_URL:-http://127.0.0.1:4096}
      - OPENCODE_USERNAME=${OPENCODE_USERNAME:-opencode}
      - OPENCODE_PASSWORD=${OPENCODE_PASSWORD}
      - OPENCODE_MODEL=${OPENCODE_MODEL}
      - RETRIEVAL_PIPELINE_URL=http://retrieval-pipeline:${RETRIEVAL_PORT:-8002}
    networks:
      - paperless-network

  # PostgreSQL
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=paperless
      - POSTGRES_PASSWORD=paperless
      - POSTGRES_DB=paperless_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - paperless-network

  # ChromaDB
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - paperless-network

  # Qdrant
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - paperless-network

  # PGVector
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=paperless
      - POSTGRES_PASSWORD=paperless
      - POSTGRES_DB=paperless_ai
    ports:
      - "5433:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    networks:
      - paperless-network

volumes:
  postgres_data:
  chroma_data:
  qdrant_data:
  pgvector_data:

networks:
  paperless-network:
    driver: bridge
