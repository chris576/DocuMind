name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  check-tag-on-main:
    name: Verify Tag is on main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag points to main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::Tag ${GITHUB_REF_NAME} zeigt nicht auf main — Container-Build übersprungen."
            exit 1
          fi
          echo "::notice::Tag ${GITHUB_REF_NAME} ist auf main — Container werden gebaut."

  build-and-push:
    name: Build & Push Images (GHCR)
    needs: check-tag-on-main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/chris576/documind/backend:${{ steps.version.outputs.version }}
            ghcr.io/chris576/documind/backend:latest

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/chris576/documind/frontend:${{ steps.version.outputs.version }}
            ghcr.io/chris576/documind/frontend:latest

      - name: Build & push ingestion-pipeline
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/ingestion-pipeline/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/chris576/documind/ingestion-pipeline:${{ steps.version.outputs.version }}
            ghcr.io/chris576/documind/ingestion-pipeline:latest

      - name: Build & push retrieval-pipeline
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/retrieval-pipeline/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/chris576/documind/retrieval-pipeline:${{ steps.version.outputs.version }}
            ghcr.io/chris576/documind/retrieval-pipeline:latest

      - name: Build & push generation-pipeline
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/generation-pipeline/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/chris576/documind/generation-pipeline:${{ steps.version.outputs.version }}
            ghcr.io/chris576/documind/generation-pipeline:latest

  release:
    name: Create GitHub Release
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes

  publish-mcp-npm:
    name: Publish MCP server to npm
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        run: npm install -g pnpm@9.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish
        run: pnpm --filter @docmind/documind-mcp-server publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
