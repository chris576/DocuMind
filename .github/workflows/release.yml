name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  check-tag-on-main:
    name: Verify Tag is on main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag points to main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::Tag ${GITHUB_REF_NAME} zeigt nicht auf main — Container-Build übersprungen."
            exit 1
          fi
          echo "::notice::Tag ${GITHUB_REF_NAME} ist auf main — Container werden gebaut."

  build-and-push:
    name: Build & Push Images (GHCR)
    needs: check-tag-on-main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/chris576/dms-rag/backend:${{ steps.version.outputs.version }}
            ghcr.io/chris576/dms-rag/backend:latest

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/chris576/dms-rag/frontend:${{ steps.version.outputs.version }}
            ghcr.io/chris576/dms-rag/frontend:latest

      - name: Build & push ingestion-pipeline
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/ingestion-pipeline/Dockerfile
          push: true
          tags: |
            ghcr.io/chris576/dms-rag/ingestion-pipeline:${{ steps.version.outputs.version }}
            ghcr.io/chris576/dms-rag/ingestion-pipeline:latest

      - name: Build & push retrieval-pipeline
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/retrieval-pipeline/Dockerfile
          push: true
          tags: |
            ghcr.io/chris576/dms-rag/retrieval-pipeline:${{ steps.version.outputs.version }}
            ghcr.io/chris576/dms-rag/retrieval-pipeline:latest

      - name: Build & push generation-pipeline
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/generation-pipeline/Dockerfile
          push: true
          tags: |
            ghcr.io/chris576/dms-rag/generation-pipeline:${{ steps.version.outputs.version }}
            ghcr.io/chris576/dms-rag/generation-pipeline:latest

  release:
    name: Create GitHub Release
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
