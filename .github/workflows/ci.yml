name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts-quality:
    name: TypeScript Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install pnpm
        run: npm install -g pnpm@9.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  python-quality:
    name: Python Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create venv
        run: python -m venv .venv

      - name: Install packages & tools
        run: |
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install \
            -e packages/python-common \
            -e packages/python-dms \
            -e packages/python-llm \
            -e packages/python-vectordb \
            "fastapi>=0.115.0" \
            "uvicorn>=0.32.0" \
            "python-dotenv>=1.0.0" \
            "pytest-cov>=5.0.0" \
            "coverage>=7.6.0" \
            "mypy>=1.11.0" \
            "bandit>=1.7.9" \
            "ruff>=0.8.0"

      - name: Run pipeline quality gates
        run: bash infrastructure/scripts/test-pipelines.sh all

  integration-tests:
    name: Integration Tests (Backend ↔ Pipelines)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install pnpm
        run: npm install -g pnpm@9.15.0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python venv + packages (für Pipeline-Harness)
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install \
            -e packages/python-common \
            -e packages/python-dms \
            -e packages/python-llm \
            -e packages/python-vectordb \
            "fastapi>=0.115.0" \
            "uvicorn>=0.32.0" \
            "python-dotenv>=1.0.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run integration tests
        run: pnpm --filter @paperless/backend test:integration
